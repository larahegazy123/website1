<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <title>صفحة البودكاست</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #004d99;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 26px;
      font-weight: bold;
    }

    .podcast-section {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .track {
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid #ddd;
    }

    .track audio {
      width: 100%;
      margin-bottom: 10px;
    }

    .info {
      font-size: 16px;
      color: #004d99;
      line-height: 1.7;
    }

    .info span {
      font-weight: bold;
      color:#004d99;
    }
  </style>
</head>
<body>
